[package]
name    = "volo_vault"
edition = "2024.beta"  # edition = "legacy" to use legacy (pre-2024) Move
# Deployed mainnet head: v13 0xdb8fca27462e39cb3cdb66c64baa498bfa037b3d8dce4046726eb4573371f02e (original id 0xcd86f77503a755c48fe6c87e1b8e9a137ec0c1bf37aac8878b6083262b27fefa). Use Move.mainnet.toml for mainnet address bindings.
published-at = "0xdb8fca27462e39cb3cdb66c64baa498bfa037b3d8dce4046726eb4573371f02e"

# navi lending core and suilend uses different pyth code repo
[dependencies.Pyth]
git      = "https://github.com/solendprotocol/pyth-crosschain.git"
rev      = "sui-contract-mainnet"
subdir   = "target_chains/sui/contracts"
override = true

# Pyth "pro compatible" deployment (0x55300367...), the one NAVI oracle v5 expects for
# PriceInfoObject. Vendored locally with its named addresses renamed
# pyth -> pyth_pro_compatible and wormhole -> wormhole_simple_majority, because the
# solendprotocol Pyth fork above already occupies the `pyth` / `wormhole` address names.
# Module bytecode is unaffected: the modules still live at 0x55300367... / 0x99de5c96...
[dependencies.PythProCompatible]
local = "./local_dependencies/pyth_pro_compatible"

[dependencies.zo_staking]
local = "./local_dependencies/zo-staking-contract"

[dependencies.CetusClmm]
git    = "https://github.com/CetusProtocol/cetus-clmm-interface.git"
subdir = "sui/cetus_clmm"
rev    = "mainnet-v1.48.4"
override = true

[dependencies.lending_core]
local = "./local_dependencies/protocol/lending_core"

[dependencies.Switchboard]
local = "./local_dependencies/switchboard_sui/on_demand"

[dependencies.suilend]
local = "./local_dependencies/suilend_d/suilend"

# MMT V3 uses local dependencies because we need to remove some test functions with errors
[dependencies.mmt_v3]
local = "./local_dependencies/mmt_v3"

[addresses]
volo_vault = "0x0"
sui_system = "0x3"
